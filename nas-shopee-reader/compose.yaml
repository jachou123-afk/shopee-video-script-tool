services:
  shopee-reader:
    build:
      context: .
    container_name: shopee-reader
    restart: unless-stopped
    init: true
    shm_size: 256m
    mem_limit: 768m
    environment:
      WORKER_WS_URL: ${WORKER_WS_URL}
      READER_TOKEN: ${READER_TOKEN}
      VNC_PASSWORD: ${VNC_PASSWORD}
      SHOPEE_HOME_URL: https://shopee.tw/
      TZ: Asia/Taipei
    volumes:
      - ./data:/data
    ports:
      - "6080:6080"
